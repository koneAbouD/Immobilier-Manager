# Infrastructure de DÉVELOPPEMENT local.
# Ports volontairement distincts de VTC Manager (5432 / 8080 / 8081) pour que
# les deux projets tournent en parallèle sur le même poste.
#
#   docker compose up -d
#   → PostgreSQL : localhost:5434
#   → Keycloak   : http://localhost:8180  (console admin : KEYCLOAK_ADMIN ci-dessous)
services:
  postgres:
    image: postgres:16-alpine
    container_name: immobilier-manager-postgres
    environment:
      POSTGRES_DB: immobilier_manager
      POSTGRES_USER: immo_user
      POSTGRES_PASSWORD: immo_password
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crée la base de Keycloak au premier démarrage (volume vide uniquement).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immo_user -d immobilier_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: immobilier-manager-keycloak
    # Le realm (rôles, client backend, utilisateur de démonstration) est importé
    # au premier démarrage depuis keycloak/realm-immobilier-manager.json.
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
