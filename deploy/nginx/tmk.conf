server {
    listen 80;
    server_name grafana.tmk.camdvr.org prometheus.tmk.camdvr.org
                minio.tmk.camdvr.org tracking.tmk.camdvr.org
                manager.tmk.camdvr.org  mdm.tmk.camdvr.org
                immobilier.tmk.camdvr.org auth.tmk.camdvr.org;
    return 301 https://$host$request_uri;
}

# ================= Grafana =================
server {
    listen 443 ssl;
    server_name grafana.tmk.camdvr.org;
    ssl_certificate     /etc/letsencrypt/live/tmk.camdvr.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tmk.camdvr.org/privkey.pem;
    location / {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;  # live tail / websockets
        proxy_set_header Connection        "upgrade";
    }
}

# ================= Prometheus =================
server {
    listen 443 ssl;
    server_name prometheus.tmk.camdvr.org;
    ssl_certificate     /etc/letsencrypt/live/tmk.camdvr.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tmk.camdvr.org/privkey.pem;
    location / {
        proxy_pass http://prometheus:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ================= MinIO console =================
server {
    listen 443 ssl;
    server_name minio.tmk.camdvr.org;
    ssl_certificate     /etc/letsencrypt/live/tmk.camdvr.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tmk.camdvr.org/privkey.pem;
    location / {
        proxy_pass http://minio:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
        chunked_transfer_encoding off;
    }
}

# ================= Traccar (tracking) =================
