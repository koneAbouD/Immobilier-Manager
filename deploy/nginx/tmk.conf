# ================= Keycloak =================
# Keycloak tourne avec le chemin relatif /keycloak : la console est sur
# https://auth.tmk.camdvr.org/keycloak/admin/ (le chemin est transmis tel quel).
# Prérequis côté Keycloak : KC_PROXY_HEADERS=xforwarded, et SURTOUT pas de
# KC_HOSTNAME fixe (l'iss des tokens obtenus en interne par les backends changerait).
server {
    listen 443 ssl;
    server_name auth.tmk.camdvr.org;
    ssl_certificate     /etc/letsencrypt/live/tmk.camdvr.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tmk.camdvr.org/privkey.pem;

    location = / {
        return 302 /keycloak/admin/;
    }

    location / {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        # Les en-têtes de réponse de Keycloak (cookies, tokens) dépassent souvent 4k
        proxy_buffer_size   128k;
        proxy_buffers       4 256k;
        proxy_busy_buffers_size 256k;
    }
}

