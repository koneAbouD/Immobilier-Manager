#
# server {
#     listen 80;
#     server_name grafana.tmk.camdvr.org prometheus.tmk.camdvr.org
#                 minio.tmk.camdvr.org tracking.tmk.camdvr.org
#                 manager.tmk.camdvr.org  mdm.tmk.camdvr.org
#                 immobilier.tmk.camdvr.org;
#     return 301 https://$host$request_uri;
# }
#
# 2) Ajouter ce bloc (par exemple juste après « tmk-manager ») :

# ================= tmk-immobilier =================
server {
    listen 443 ssl;
    server_name immobilier.tmk.camdvr.org;
    ssl_certificate     /etc/letsencrypt/live/tmk.camdvr.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tmk.camdvr.org/privkey.pem;
    # Aligné sur spring.servlet.multipart.max-request-size (10MB)
    client_max_body_size 10m;
    location / {
        proxy_pass http://immobilier-manager-backend:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 600s;
    }
}
