spring:
  application:
    name: immobilier-manager

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:immobilier_manager}}
    username: ${DB_USERNAME:immo_user}
    password: ${DB_PASSWORD:immo_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Le schéma est géré par Flyway : Hibernate vérifie seulement que la base
    # correspond aux entités, sans jamais la modifier.
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Les associations paresseuses hors du graphe se chargent par lots de 50
        # au lieu d'une requête par ligne.
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration/flyway/schema,classpath:db/migration/flyway/jdd/reference

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:8MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/immobilier-manager}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/immobilier-manager/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8082}
  tomcat:
    # Laisse Tomcat consommer tout le corps d'une requête trop volumineuse afin
    # que Spring renvoie proprement le 413.
    max-swallow-size: -1

app:
  scheduler:
    # Émet les échéances de loyer des baux actifs (idempotent) : le mois en
    # cours à partir du 25, les mois précédents sinon.
    echeances-loyer-cron: "0 10 0 * * *"   # tous les jours à 00h10
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  # Le backend est le seul interlocuteur de Keycloak : le mobile ne lui parle jamais.
  keycloak:
    auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:immobilier-manager}
    client-id: ${KEYCLOAK_CLIENT_ID:immobilier-manager-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:rj0yS7GF7JHnvMjPI3DVu0b1bbLohBax}

  # Stockage objet des documents chargés (contrats signés) : MinIO ou compatible S3.
  stockage:
    endpoint: ${STOCKAGE_ENDPOINT:http://localhost:9010}
    access-key: ${STOCKAGE_ACCESS_KEY:immo_minio}
    secret-key: ${STOCKAGE_SECRET_KEY:immo_minio_password}
    bucket: ${STOCKAGE_BUCKET:immobilier-documents}

  # Bailleur imprimé sur les contrats de bail. Les champs vides laissent une
  # ligne à compléter à la main sur le PDF.
  bailleur:
    nom: ${BAILLEUR_NOM:TMK}
    representant: ${BAILLEUR_REPRESENTANT:}
    adresse: ${BAILLEUR_ADRESSE:}
    telephone: ${BAILLEUR_TELEPHONE:}
    email: ${BAILLEUR_EMAIL:}
    ville: ${BAILLEUR_VILLE:Abidjan}

logging:
  level:
    org.springframework.security: INFO
    com.tmk.immobilier: DEBUG
